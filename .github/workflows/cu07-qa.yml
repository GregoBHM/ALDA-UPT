name: CU-07 pruebas unitarias e integración simulada
on:
  push:
    branches:
      - qa/cu07-pruebas-2026-11-24
  pull_request:
    branches:
      - fix/manual-despliegue-local-2026-11

permissions:
  contents: read

jobs:
  cu07-pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Instalar dependencias y pytest
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest httpx
      - name: CP-31 y CP-34 (simulados)
        working-directory: backend
        run: python -m pytest tests/test_cu07.py -v --tb=short
