name: Pruebas automatizadas ALDA-UPT

on:
  push:
    branches: [main, 'qa/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pruebas:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: alda_qa
          POSTGRES_PASSWORD: alda_qa_local
          POSTGRES_DB: alda_qa
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U alda_qa -d alda_qa"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ALDA_TEST_DATABASE_URL: postgresql+pg8000://alda_qa:alda_qa_local@127.0.0.1:5432/alda_qa
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Preparar directorio de resultados
        run: mkdir -p qa-resultados
      - name: Instalar dependencias del backend
        working-directory: backend
        run: python -m pip install -r requirements.txt pytest==9.2.0 httpx==0.28.1
      - name: Preparar imagen del compilador C++
        run: docker pull gcc:12
      - name: Ejecutar pytest con PostgreSQL temporal
        working-directory: backend
        run: python -m pytest -ra --junitxml=../qa-resultados/backend.xml
      - name: Instalar dependencias del frontend
        if: success() || failure()
        id: frontend_deps
        working-directory: frontend
        run: npm ci
      - name: Compilar frontend e instalar Chromium
        if: ${{ !cancelled() && steps.frontend_deps.outcome == 'success' }}
        id: frontend_build
        working-directory: frontend
        env:
          VITE_API_URL: http://127.0.0.1:4173
        run: |
          npm run build
          npx playwright install --with-deps chromium
      - name: Ejecutar pruebas de interfaz
        if: ${{ !cancelled() && steps.frontend_build.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          npm --prefix frontend run preview -- --host 127.0.0.1 --port 4173 --strictPort > qa-resultados/vite.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          curl --fail --silent --retry 15 --retry-delay 1 --retry-connrefused http://127.0.0.1:4173/ > /dev/null
          NODE_PATH="$PWD/frontend/node_modules" node --test \
            --test-reporter=spec --test-reporter-destination=stdout \
            --test-reporter=junit --test-reporter-destination=qa-resultados/browser.xml \
            qa/browser/flows.test.cjs
      - name: Publicar resultados automatizados por caso de uso
        if: always()
        run: python qa/report.py qa-resultados/backend.xml qa-resultados/browser.xml qa-resultados
      - name: Guardar reportes de la ejecución
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultados-pruebas-alda
          path: qa-resultados/
