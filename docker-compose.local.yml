services:

  db:
    image: postgres:15-alpine
    container_name: alda_postgres_local
    restart: unless-stopped
    env_file: .env.local
    environment:
      POSTGRES_DB: alda_db
      POSTGRES_USER: alda_admin
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_local_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    # PostgreSQL se comunica internamente por db:5432.
    # No publicar 5432 en Windows evita conflictos con otros PostgreSQL.
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alda_admin -d alda_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  chroma:
    image: chromadb/chroma:1.5.9
    container_name: alda_chroma_local
    restart: unless-stopped
    ports:
      - "127.0.0.1:8100:8000"
    volumes:
      - chroma_local_data:/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: alda_backend_local
    restart: unless-stopped
    env_file: .env.local
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /tmp:/tmp
      - uploads_local_data:/app/uploads
    environment:
      DB_HOST: db
      DB_PORT: 5432
      POSTGRES_DB: alda_db
      POSTGRES_USER: alda_admin
      DB_PASSWORD: ${DB_PASSWORD}
      CHROMA_HOST: chroma
      CHROMA_PORT: 8000
      GOOGLE_AI_API_KEY: ${GOOGLE_AI_API_KEY}
      GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID}
      SESSION_SECRET: ${SESSION_SECRET}
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-8}
      COOKIE_SECURE: "false"
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL}
      CORS_ORIGINS: ${CORS_ORIGINS}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
      chroma:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:8000/api/health > /dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 45s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID}
        VITE_API_URL: ${VITE_API_URL}
    container_name: alda_frontend_local
    restart: unless-stopped
    ports:
      - "127.0.0.1:5173:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_local_data:
  chroma_local_data:
  uploads_local_data:
