services:

  db:
    image: postgres:15-alpine
    container_name: alda_postgres_local
    restart: unless-stopped
    env_file: .env.local
    environment:
      POSTGRES_DB: alda_db
      POSTGRES_USER: alda_admin
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_local_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alda_admin -d alda_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  chroma:
    image: chromadb/chroma:latest
    container_name: alda_chroma_local
    restart: unless-stopped
    environment:
      IS_PERSISTENT: "TRUE"
    ports:
      - "8100:8000"
    volumes:
      - chroma_local_data:/chroma/chroma

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: alda_backend_local
    restart: unless-stopped
    env_file: .env.local
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /tmp:/tmp
      - uploads_local_data:/app/uploads
    environment:
      DB_HOST: db
      DB_PORT: 5432
      POSTGRES_DB: alda_db
      POSTGRES_USER: alda_admin
      DB_PASSWORD: ${DB_PASSWORD}
      CHROMA_HOST: chroma
      CHROMA_PORT: 8000
      GOOGLE_AI_API_KEY: ${GOOGLE_AI_API_KEY}
      GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID}
      SESSION_SECRET: ${SESSION_SECRET}
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-8}
      COOKIE_SECURE: "false"
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL}
      CORS_ORIGINS: ${CORS_ORIGINS}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      chroma:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID}
        VITE_API_URL: ${VITE_API_URL}
    container_name: alda_frontend_local
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres_local_data:
  chroma_local_data:
  uploads_local_data:
