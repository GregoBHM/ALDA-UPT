services:
  postgres:
    image: postgres:15-alpine
    container_name: alda_postgres
    restart: always
    environment:
      POSTGRES_USER: alda_admin
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: alda_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql

  chromadb:
    image: chromadb/chroma:latest
    container_name: alda_chroma
    restart: always
    environment:
      - IS_PERSISTENT=TRUE
    ports:
      - "8100:8000"
    volumes:
      - chroma_data:/chroma/chroma

volumes:
  postgres_data:
  chroma_data:
